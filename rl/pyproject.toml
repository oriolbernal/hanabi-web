[project]
name = "hanabi-rl"
version = "0.1.0"
description = "Train a hint-giving policy for Hanabi solitaire with reinforcement learning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
    "sb3-contrib>=2.4",
    "stable-baselines3>=2.4",
    "tensorboard>=2.18",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
